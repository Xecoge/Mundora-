name: Mundora app (Android)
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/app.yml']
permissions:
  contents: write
concurrency:
  group: mundora-app
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Build APK
        working-directory: mobile
        env:
          KP: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -o pipefail
          {
            python3 -m pip install --quiet --break-system-packages pillow
            echo "ANDROID_HOME=$ANDROID_HOME"
            npm install --no-audit --no-fund
            npx cap add android
            python3 brand.py android
            npx cap sync android
            cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -q && cd ..
            if [ -n "$KP" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -in keys/release.jks.enc -out ks.jks -pass env:KP; PASS="$KP"; echo "Подпись: основной ключ"
            else
              cp keys/test.jks ks.jks; PASS=mundora-test; echo "Подпись: тестовый ключ (секрет ANDROID_KEY_PASS не задан)"
            fi
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks ks.jks --ks-key-alias mundora --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out ../Mundora.apk aligned.apk
            "$BT/apksigner" verify ../Mundora.apk && rm -f ks.jks
          } 2>&1 | tee ../android.log
      - name: Report error
        if: failure()
        run: touch android.log; echo "::error title=android::$(tail -c 3500 android.log | perl -pe 's/%/%25/g; s/\r//g; s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: Mundora.apk }

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Mundora ${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            out/Mundora.apk
          body: |
            **Android:** скачай `Mundora.apk` и установи (разреши установку из этого источника).
