name: Mundere (Android)
on:
  push:
    branches: [main]
    paths: ['mundere/**', 'mobile/**', '.github/workflows/mundere.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mundere-app
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Build APK
        env:
          KP: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -o pipefail
          {
            python3 -m pip install --quiet --break-system-packages pillow
            rm -rf mbuild && cp -r mobile mbuild && cd mbuild
            # Mundere — только мессенджер Mundora; код сайта (дизайн 1:1) вшит в APK, данные — те же, с сервера
            python3 - <<'PY'
          import json
          c = json.load(open('capacitor.config.json'))
          c.update(appId='app.mundere', appName='Mundere', appendUserAgent='MundoraApp Mundere')
          c['server']['url'] = 'https://mundorai.vercel.app/#msg'
          json.dump(c, open('capacitor.config.json', 'w'), ensure_ascii=False, indent=2)
          PY
            npm install --no-audit --no-fund
            npx cap add android
            BRAND=mundere python3 brand.py android
            npx cap sync android
            chmod +x android/gradlew
            (cd android; ./gradlew assembleRelease --no-daemon -q)
            if [ -n "$KP" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -in keys/release.jks.enc -out ks.jks -pass env:KP; PASS="$KP"; echo "Подпись: основной ключ"
            else
              cp keys/test.jks ks.jks; PASS=mundora-test; echo "Подпись: тестовый ключ"
            fi
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks ks.jks --ks-key-alias mundora --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out ../Mundere.apk aligned.apk
            "$BT/apksigner" verify ../Mundere.apk && rm -f ks.jks
            ls -la ../Mundere.apk
          } 2>&1 | tee mundere.log
      - name: Report error
        if: failure()
        run: touch mundere.log; echo "::error title=mundere::$(tail -c 3500 mundere.log | perl -pe 's/%/%25/g; s/\r//g; s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mundere, path: "Mundere.apk\nmundere.log" }

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mundere-${{ github.run_number }}
          name: Mundere ${{ github.run_number }}
          make_latest: false
          files: out/Mundere.apk
          body: |
            **Mundere для Android:** скачай `Mundere.apk` и установи (разреши установку из этого источника).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mundere-latest
          name: Mundere (последняя версия)
          make_latest: false
          overwrite_files: true
          files: out/Mundere.apk
          body: |
            Всегда последняя сборка Mundere для Android. Ссылка не меняется: releases/download/mundere-latest/Mundere.apk
